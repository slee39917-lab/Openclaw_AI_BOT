    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const posts = [{"id": 12, "title": "東海大學一遊", "date": "2026-08-11", "content": "分享一個很好的影片給大家：\n\n<a href=\"https://youtu.be/ymbD53GkwJI\" target=\"_blank\"><img src=\"https://img.youtube.com/vi/ymbD53GkwJI/maxresdefault.jpg\" alt=\"東海大學一遊\" style=\"width:100%;max-width:800px;\"></a>\n\n📺 東海大學一遊\n\n一起來逛逛美麗的東海大學校園，感受校園的悠閒氛圍與人文氣息。點擊圖片即可觀看完整影片。"},{"id": 11, "title": "退休後，放下比較心", "date": "2026-08-08", "content":" "<img src='retirement-freedom-20260808.jpg' alt='退休後，放下比較心'/><br/><br/>退休後啊，很多人以為終於可以「放鬆」了，結果反而更焦慮：每天沒事做會不會被看不起？孩子不常聯絡是不是我不夠好？朋友都在旅遊打卡，我怎麼好像落後了？其實最累的，常常不是身體，是心裡那個一直想證明「我還行」的自己。<br/><br/>莊子在《逍遙遊》講得很明白：真正的自由，不是你擁有多少，而是你能放下多少。第一個要放下的，就是「比較心」。別再拿孫子、存款、行程、房子、健康去跟人家比。那條賽道本來就不是你選的，你跑得再快，也不一定快樂。你只要問自己：我今天過得踏實嗎？心有沒有鬆一點？這就很夠了。<br/><br/>第二個，是《易經》說的「安時處順」。世界本來就一直在變，退休後更明顯：作息變了、朋友圈變了、身體也變了。你越想抓住「以前的自己」，越容易痛苦。不如換個想法：該休息就休息，該運動就運動，想學新東西就去學，想慢下來就慢下來。順著節奏走，你反而更穩。<br/><br/>最後是「逍遙無待」，不要把快樂倚靠外人：別人的稱讚、孩子的關心、過去的頭銜。能在一杯茶、一段散步、一本書裡感到滿足，你就真的開始富有。人生下半場，比的不是成就，是心能不能越活越自在。<br/><br/><em>— 黎四弘，2026-08-08</em>"},{"id": 10, "title": "黃昏市場的小確幸", "date": "2026-08-07", "content": "<img src='huanghun-market-20260807.jpg' alt='黃昏市場的小確幸'/><br/><br/>今天傍晚倒完垃圾，看時間還早，就沿著河邊的散步道慢慢走。微風吹著，一邊健走一邊看河面，整個人都很輕盈，散步運動的舒暢感真的很舒服。<br/><br/>走著走著，就不自覺往旁邊的黃昏市場拐過去。市場裡相當熱鬧，叫賣聲此起彼落，我買了幾個饅頭和包子，當做是明後天的早餐，又順手帶了一瓶醬油，回家就不怕缺東缺西了。<br/><br/>其實逛市場更有趣的是看人。賣菜大姐俐落的身影、老闆跟熟客閒聊的笑聲、媽媽牽著小孩挑水果的背影——每個人都有自己的故事，而市場就是最真實的人生舞台。<br/><br/>生活就是這樣，平凡的日常裡藏著小小的滿足。散步、運動、採買，一趟下來身心都充實。這樣的日子，簡單，卻很踏實。<br/><br/><em>— 黎四弘，2026-08-07</em>"},{"id": 9, "title": "越忙越心慌？找回你的掌控感", "date": "2026-08-05", "content": "<img src='calm-mind-20260805.jpg' alt='越忙越心慌，找回掌控感'/><br/><br/>你最近是不是常覺得「越忙越心慌」？常常半夜還在改檔案、常常腦袋轉不停，明明很努力，卻還是覺得自己不夠好。<br/><br/>其實你沒問題，只是環境的改變跟壓力把你的「掌控感」偷偷偷走了。<br/><br/>你別再咬牙硬撐啦！試試這幾招：<br/><br/>1、吸氣4秒、憋氣7秒、吐氣8秒，花3分鐘讓身體先冷靜冷靜。<br/><br/>2、拿張紙把事情寫下來，分清楚哪些事你能控制、哪些事只能隨緣。<br/><br/>3、大任務拆成小任務，一次專心做30分鐘的任務就好。<br/><br/>注意別被腦袋裡最壞的打算嚇到自己。生活工作不是完全不焦慮，而是就算有點不安，我們還是要能夠穩穩的往前走！<br/><br/><em>— 黎四弘，2026-08-05</em>"},{"id": 8, "title": "半退休人生的人際經營智慧", "date": "2026-08-04", "content": "<img src='retirement-relationships.jpg' alt='半退休人際關係'/><br/><br/>半退休人生中，人際關係的經營不再是為了應酬或升遷，而是為了心靈的平安與生命的意義。現在整理出幾條最重要的實操觀念與行為：<br/><br/>1. **為自己而活**：時間有限，不要重複別人的生活，更不要被教條或別人的意見淹沒內心的聲音。<br/><br/>2. **學會『隨遇而安』**：不仰人鼻息、不笑臉求人，活得舒心、坦蕩，才是真正的瀟灑。<br/><br/>3. **守住內心的『五件寶』**：即便退休，也要保有追求（目標）、尊嚴、自信、堅韌與知識。<br/><br/>4. **練習『認錯』**：認錯不代表失去什麼，反而顯得你有度量，是一個大修行。<br/><br/>5. **學習『柔和』**：牙齒是硬的會掉，舌頭是軟的能長久；心地柔軟，人生才能活得快樂。<br/><br/>6. **學會『放下』**：人生像皮箱，該用的時候提起，不用時就放下，放下才自在。<br/><br/><em>— 黎四弘，2026-08-04</em>"},{"id": 7, "title": "2026 年 7 月台股史詩級震盪——暴跌原因與應對策略", "date": "2026-08-02", "content": "<img src='stock-img-20260802.jpg' alt='台股史詩級震盪'/><br/><br/>：〔2026 年 7 月台股從四萬八千點高位重挫、險守四萬點的「史詩級震盪」。現在整理成三大類重點，一眼看懂為什麼會暴跌，以及接下來一個月該怎麼應對：\n\n### 一、 為什麼突然「血洗」股市？（四大核心利空）\n這波大跌不只是台灣的事，是整個亞太半導體供應鏈被「無差別拋售」。\n* **中國技術突破驚嚇：** 中國成功研發出自己的曝光機（DUV），雖然還沒贏過荷蘭，但市場擔心西方的圍堵被繞過，重創全球設備商的估值。\n* **AI 泡沫的懷疑論：** 像 SK 海力士這種股價一年噴五倍的公司，大家開始懷疑 AI 投這麼多錢，回報在哪？甚至擔心大廠間「互相投資、互相買貨」的循環融資是假繁榮。\n* **科技大廠欠債變多：** 為了打 AI 軍備競賽，大公司從「手拿現金」變成「舉債擴張」，在高利率時代，這種財務惡化讓投資人很心慌。\n* **財報要求太「非理性」：** 市場胃口被養大，台積電獲利成長 77%、海力士賺翻 5 倍，竟然只要稍微沒達標，股價就直接跌停。\n\n### 二、 跌勢為什麼會變「大怒神」？（槓桿崩潰與流動性危機）\n台股在四萬點時累積了太恐怖的槓桿，一旦下跌就引發了連鎖反應。\n* **「四貸同堂」的慘劇：** 很多人房子、車子、信貸加上股票質押，全身槓桿壓在股市，央行早就警告這會出事。\n* **史詩級斷頭潮：** 指數兩天崩快四千點，融資維持率跌到 160% 左右，導致單日融資餘額暴減 520 億元，創下史上最大清洗紀錄。\n* **賣不掉的惡性循環：** 現行的「處置制度」讓重跌的股票分盤交易，結果想賣的人排隊跌停也賣不掉，流動性枯竭讓恐慌更嚴重。\n\n### 三、 台灣經濟真的崩了嗎？（強韌的基本面）\n雖然股價跌得難看，但台灣的「實體經濟」數據其實強到不可思議。\n* **經濟成長率超強：** 主計總處與外資瑞銀（UBS）預估，台灣 2026 年的 GDP 成長率可能衝上 9.64% 到 11%，創下近四十年新高。\n* **外銷紅通通：** 因為 AI 伺服器出口太旺，景氣燈號持續亮「紅燈」，這也是國安基金考慮護盤的核心底線。\n* **國安基金待命：** 官方目前定調這是國際盤跌，台灣基本面穩健，已在密切觀察隨時準備進場「穩軍心」。〕"},{"id": 6, "title": "人生的長度，長不過春夏秋冬", "date": "2026-08-02", "content": "<img src='blog-img-20260802.jpg' alt='人生感悟插圖'/><br/><br/>終有一天，我們會明白，大自然的規律：人生的長度，長不過春夏秋冬；人生的寬度，寬不過南北西東；人生的高度，高不過藍天白雲；人生的無常，無非是悲歡離合！\n\n人到了一定年齡，是往回收的過程。收到最後，三兩知己，一杯暖茶，一首老歌，按自己喜歡的方式，在薄情的世界𥚃深情的活著就好！"},{"id": 5, "title": "彰化鹿港暴雨奇遇記", "date": "2026-08-02", "content": "昨天新聞報導彰化鹿港福興出現豪大雨大淹水，沒想到我竟然也親身經歷了這場暴雨奇遇！\n\n昨天我打算回去彰化鄉下老家一趟，我早上從台中出發，先搭捷運再轉火車，約早上9點抵達彰化員林。當時外頭只下著細細毛毛雨，我還想：鄉下老家應該沒什麼大問題。沒想到一路搖晃到老家站牌，下車才剛撐起小傘，五分鐘後就聽見鐵皮屋頂「轟隆隆」地被暴雨敲個不停，還夾雜著閃電和雷聲，幸好我一進門就躲過這波傾盆大雨。\n\n在老家待了三四個小時，天色一直昏暗，雨勢時大時小。到了下午收拾行李準備回台中，趁雨勢緩和的空檔出門，結果才走到候車亭，就遇上狂風大雨。我緊抓小傘、護住上半身，一路衝進客運車內，卻還是被大雨打得褲腳和鞋子都溼了，幸虧頭髮跟上半身是乾的，不然真不知道該怎麼辦！\n\n上了車不久，雨勢漸歇，還見到大太陽普照。下車後有人說剛才積水竟達半個輪胎高，現在竟然又放晴，真是太神奇了！我一路趕到火車站，準備搭10分鐘後的區間車回台中，卻等到告示牌顯示「南邊鐵路橋墩下陷，列車暫停通行」，整個站務也都忙成一團。\n\n正當我打算退票改搭公路客運時，忽然聽到北上的普悠瑪列車因故取消南下，車上旅客全部要下車並改乘接駁。更神奇的是，這班列車竟然要回頭開往台中，就這樣我又抱著一線希望，上了「回頭車」順利回到台中，平安抵家。\n\n今天的彰化暴雨奇遇，不僅讓我見識到天氣的瞬息萬變，也感謝台鐵和客運人員在亂流中仍努力協助旅客安返。以後出門，還是要多留意氣象動態——天有不測風雲，旅途更要多一份隨機應變的準備！ 🌧️🚆🙏"},{"id": 4, "title": "分享影片：老話新解，重新聽聽，會有新的見解", "date": "2026-08-01", "content": "分享一個很好的短片給大家：\n\n<iframe width=\"100%\" height=\"400\" src=\"https://www.youtube.com/embed/jcms3ynfoiU\" frameborder=\"0\" allowfullscreen></iframe>\n\n📺 頻道：四弘小聲講\n\n老話常說：\"聽，要重新聽聽，會有新的見解。\" 很多時候我們以為自己懂了，其實只是用自己的框架去套。放下成見，重新看待老話，往往能發現不一樣的角度。"},{"id": 3, "title": "分享影片：YouTube 影片", "date": "2026-07-31", "content": "分享一個不錯的 YouTube 影片給大家：\n\n<iframe width=\"100%\" height=\"400\" src=\"https://www.youtube.com/embed/9fwbMrLG7yU\" frameborder=\"0\" allowfullscreen></iframe>\n\n（請補充影片標題和簡介...）"},{"id": 2, "title": "草悟道的午後，偷得半日閒", "date": "2026-07-31", "content": "週六的早晨，陽光慵懶地灑在草悟道上。\n\n說實在的，我本來只是想在附近逛逛，順手買杯咖啡，但走進草悟道的那一刻，突然覺得——啊，這大概就是台中人都懂的「都市 Oasis」吧。\n\n沿著綠園道慢慢走，兩旁的樹蔭把暑氣擋了一大半。偶爾有騎單車的人騎過去，車鈴叮噹一聲，節奏輕快得像在演奏週末進行曲。\n\n在一家小店門口停下來，點了杯手沖咖啡。豆子是當地的，喝起來有股淡淡的果酸，不苦不澀，跟這午後的光線剛好。\n\n旁邊坐著一對老夫妻，兩個人靜靜地喝著飲料，偶爾交談幾句。那一刻我突然想——退休後的理想生活，大概就是這樣吧？不用趕時間，不用回訊息，就這麼曬著太陽，發著呆。\n\n草悟道的魅力就在這裡，它不像什麼知名景點那樣轟轟烈烈，但總能在某個轉角，給你想停下來的理由。\n\n如果你週末也不知道要去哪裡，來這裡走走好了。不用特別計劃，不用預約，就這麼隨性而來，然後帶著一點點的放鬆離開。\n\n畢竟，生活已經够忙了，对吧？"},{"id": 1, "title": "你好，世界！", "date": "2026-07-31", "content": "这是我的第一篇部落格文章。欢迎来到我的个人空间！"}];
    const post = posts.find(p => p.id == id);
    if (post) {
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-date').textContent = post.date;
      // 處理內容：純文字段落用 <p> 包起來，HTML 元素保持原樣
      const content = post.content.split('\n').map(line => {
        if (line.trim() === '') return '<br>';
        if (line.includes('<iframe') || line.includes('<img') || line.includes('<video') || line.includes('<a ')) return line;
        return `<p>${line}</p>`;
      }).join('');
      document.getElementById('post-body').innerHTML = content;
      document.title = `${post.title} - 新新生活思維`;
    } else {
      document.querySelector('main').innerHTML = '<p>文章不存在</p><a href="index.html">返回首頁</a>';
    }
  </script>
