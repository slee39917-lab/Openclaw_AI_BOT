      {"id":2,"title":"草悟道的午後，偷得半日閒","date":"2026-07-31","content":"週六的早晨，陽光慵懶地灑在草悟道上。\n\n說實在的，我本來只是想在附近逛逛，順手買杯咖啡，但走進草悟道的那一刻，突然覺得——啊，這大概就是台中人都懂的「都市 Oasis」吧。\n\n沿著綠園道慢慢走，兩旁的樹蔭把暑氣擋了一大半。偶爾有騎單車的人騎過去，車鈴叮噹一聲，節奏輕快得像在演奏週末進行曲。\n\n在一家小店門口停下來，點了杯手沖咖啡。豆子是當地的，喝起來有股淡淡的果酸，不苦不澀，跟這午後的光線剛好。\n\n旁邊坐著一對老夫妻，兩個人靜靜地喝著飲料，偶爾交談幾句。那一刻我突然想——退休後的理想生活，大概就是這樣吧？不用趕時間，不用回訊息，就這麼曬著太陽，發著呆。\n\n草悟道的魅力就在這裡，它不像什麼知名景點那樣轟轟烈烈，但總能在某個轉角，給你想停下來的理由。\n\n如果你週末也不知道要去哪裡，來這裡走走好了。不用特別計劃，不用預約，就這麼隨性而來，然後帶著一點點的放鬆離開。\n\n畢竟，生活已經够忙了，对吧？"},
      {"id":1,"title":"你好，世界！","date":"2026-07-31","content":"这是我的第一篇部落格文章。欢迎来到我的个人空间！"}
