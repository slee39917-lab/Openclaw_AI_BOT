name: Deploy Hugo to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.4'
          extended: true
      - name: Build
        run: |
          cd blog-preview
          hugo --minify
          # Copy built files to repo root for GitHub Pages
          cp -rf public/* ../
          rm -f ../index.html
cp public/index.html ../index.html
      - name: Commit and push changes
        run: |
          git config user.name "slee39917-lab"
          git config user.email "slee39917-lab@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy: $(date +'%Y-%m-%d %H:%M')"
          git push
