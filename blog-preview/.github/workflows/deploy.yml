name: Build and Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.111.3"
          extended: true

      - name: Build
        working-directory: blog-preview
        run: hugo --minify

      - name: Deploy
        working-directory: blog-preview
        run: |
          # Clean old posts directory
          rm -rf ../../posts/
          
          # Copy generated site files to repo root
          cp -rf public/* ../../
          
          # Remove the old public directory
          rm -rf public/
