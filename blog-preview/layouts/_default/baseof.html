<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }} - {{ if .Title }}{{ .Title }}{{ else }}{{ .Name }}{{ end }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; line-height: 1.6; background: #fafafa; }
        nav { background: #333; padding: 1rem; display: flex; align-items: center; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin-right: 15px; }
        nav a:hover { text-decoration: underline; }
        .logo { font-weight: bold; font-size: 1.2em; margin-right: auto; }
        main { max-width: 800px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .full-post h1 { margin-top: 0; }
        .full-post time { color: #666; font-size: 0.9em; display: block; margin-bottom: 1rem; }
        .content { margin-top: 1rem; }
        .tags { margin-bottom: 1rem; }
        .tag { background: #f0f0f0; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85em; margin-right: 0.5rem; }
        .back-link { margin-top: 2rem; }
        footer { text-align: center; padding: 2rem; color: #666; }
    </style>
</head>
<body>
    {{ block "main" . }}{{ end }}
    <footer>
        <p>&copy; {{ now.Year }} {{ .Site.Title }} — 由 Hugo 驅動，GitHub Pages 託管</p>
    </footer>
</body>
</html>
