<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Room wall -->
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBF3E6"/>
      <stop offset="100%" style="stop-color:#F3E4D0"/>
    </linearGradient>
    <!-- Window morning light -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BFE1F0"/>
      <stop offset="60%" style="stop-color:#E7F1E4"/>
      <stop offset="100%" style="stop-color:#FBEFD6"/>
    </linearGradient>
    <!-- Warm screen glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE9B0;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#FFE9B0;stop-opacity:0"/>
    </radialGradient>
    <!-- Soft light shaft -->
    <linearGradient id="shaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3D2;stop-opacity:0.65"/>
      <stop offset="100%" style="stop-color:#FFF3D2;stop-opacity:0"/>
    </linearGradient>
    <!-- Desk wood -->
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8A469"/>
      <stop offset="100%" style="stop-color:#B9813F"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="800" height="400" fill="url(#wall)"/>

  <!-- Window -->
  <rect x="52" y="48" width="230" height="180" rx="10" fill="#E4CDA9"/>
  <rect x="62" y="58" width="210" height="160" rx="6" fill="url(#sky)"/>
  <circle cx="220" cy="102" r="24" fill="#FFD98A" opacity="0.9"/>
  <!-- distant hills through window -->
  <path d="M62,178 Q110,150 160,172 Q210,150 272,176 L272,218 L62,218 Z" fill="#A9C69A" opacity="0.85"/>
  <g stroke="#E4CDA9" stroke-width="7">
    <line x1="167" y1="58" x2="167" y2="218"/>
    <line x1="62" y1="138" x2="272" y2="138"/>
  </g>
  <rect x="46" y="222" width="242" height="12" rx="4" fill="#D2B58C"/>

  <!-- Light shaft from window -->
  <polygon points="62,58 272,58 470,400 210,400" fill="url(#shaft)"/>

  <!-- Wall shelf with small book -->
  <rect x="330" y="70" width="120" height="8" rx="3" fill="#C79A63"/>
  <rect x="344" y="42" width="14" height="28" rx="2" fill="#E08A6B"/>
  <rect x="361" y="46" width="12" height="24" rx="2" fill="#7FB3A5"/>
  <rect x="376" y="40" width="14" height="30" rx="2" fill="#C9A24B"/>

  <!-- Desk -->
  <rect x="196" y="292" width="560" height="20" rx="6" fill="url(#wood)"/>
  <rect x="232" y="312" width="16" height="76" fill="#A9722F"/>
  <rect x="708" y="312" width="16" height="76" fill="#A9722F"/>

  <!-- Laptop -->
  <g transform="translate(430,206)">
    <rect x="-2" y="66" width="150" height="10" rx="4" fill="#D9D2C7"/>
    <rect x="6" y="10" width="134" height="62" rx="6" fill="#3B4350"/>
    <rect x="12" y="16" width="122" height="50" rx="4" fill="#F7FAFB"/>
    <!-- screen glow -->
    <circle cx="73" cy="41" r="70" fill="url(#screenGlow)"/>
    <!-- chat lines on screen -->
    <rect x="22" y="24" width="60" height="7" rx="3.5" fill="#8FC7E8"/>
    <rect x="52" y="37" width="70" height="7" rx="3.5" fill="#E7E1D6"/>
    <rect x="22" y="50" width="74" height="7" rx="3.5" fill="#B9DFC4"/>
    <circle cx="118" cy="56" r="6" fill="#F2C14E"/>
  </g>

  <!-- Person (side-back view, seated) -->
  <g transform="translate(300,150)">
    <!-- chair back -->
    <rect x="6" y="70" width="18" height="96" rx="8" fill="#8E9AA8"/>
    <!-- body -->
    <path d="M32,92 Q72,80 86,120 L92,178 L28,178 Q20,132 32,92 Z" fill="#7C9C86"/>
    <!-- arm reaching to laptop -->
    <path d="M80,116 Q112,124 132,140" stroke="#7C9C86" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- neck + head -->
    <rect x="46" y="58" width="22" height="20" rx="8" fill="#EDC9A6"/>
    <circle cx="58" cy="46" r="26" fill="#EDC9A6"/>
    <!-- hair (thinning top, grey) -->
    <path d="M34,42 Q58,16 84,42 Q74,30 58,30 Q42,30 34,42 Z" fill="#D8D8D6"/>
    <path d="M36,44 Q40,32 52,30 Q40,38 38,50 Z" fill="#CFCFCD"/>
    <!-- glasses -->
    <circle cx="50" cy="47" r="7" fill="none" stroke="#5B6570" stroke-width="2.4"/>
    <circle cx="68" cy="47" r="7" fill="none" stroke="#5B6570" stroke-width="2.4"/>
    <line x1="57" y1="47" x2="61" y2="47" stroke="#5B6570" stroke-width="2"/>
    <!-- slight smile -->
    <path d="M52,57 Q58,60 64,57" stroke="#B98A66" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tea cup on desk -->
  <g transform="translate(636,258)">
    <ellipse cx="26" cy="36" rx="30" ry="7" fill="#E6D6BF"/>
    <path d="M2,10 L50,10 L45,34 Q26,42 7,34 Z" fill="#FFFFFF"/>
    <ellipse cx="26" cy="10" rx="24" ry="6" fill="#EAD9BE"/>
    <ellipse cx="26" cy="10" rx="18" ry="4" fill="#8A5A34"/>
    <path d="M50,15 q14,4 8,14 q-4,6 -12,3" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <!-- steam -->
    <path d="M20,-2 q-6,10 2,18" stroke="#D9CDBB" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M33,-6 q-6,12 2,22" stroke="#D9CDBB" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Plant on desk left -->
  <g transform="translate(214,232)">
    <path d="M18,44 L30,44 L27,66 L21,66 Z" fill="#C97B5A"/>
    <ellipse cx="24" cy="44" rx="15" ry="5" fill="#B5674A"/>
    <path d="M24,44 Q10,20 2,4 Q16,10 24,32 Z" fill="#6FAE74"/>
    <path d="M24,44 Q38,22 46,6 Q32,12 24,34 Z" fill="#7FBC82"/>
    <path d="M24,44 Q24,18 24,0 Q30,18 24,42 Z" fill="#5E9E66"/>
  </g>

  <!-- AI assistant robots -->
  <!-- Robot A (floating right, chatting) -->
  <g transform="translate(556,96)">
    <rect x="0" y="12" width="52" height="42" rx="14" fill="#9EC5E0"/>
    <rect x="7" y="20" width="38" height="24" rx="9" fill="#F4FAFF"/>
    <circle cx="19" cy="32" r="4" fill="#3B4350"/>
    <circle cx="33" cy="32" r="4" fill="#3B4350"/>
    <path d="M20,41 Q26,45 32,41" stroke="#3B4350" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="26" y1="12" x2="26" y2="3" stroke="#7FA9C6" stroke-width="3"/>
    <circle cx="26" cy="1" r="4" fill="#F2C14E"/>
    <circle cx="2" cy="33" r="4" fill="#7FA9C6"/>
    <circle cx="50" cy="33" r="4" fill="#7FA9C6"/>
  </g>

  <!-- Robot B (small, hovering left of screen) -->
  <g transform="translate(352,110)">
    <rect x="0" y="10" width="42" height="34" rx="12" fill="#B9DFC4"/>
    <rect x="6" y="17" width="30" height="19" rx="7" fill="#F6FFF8"/>
    <circle cx="16" cy="26" r="3.2" fill="#3B4350"/>
    <circle cx="28" cy="26" r="3.2" fill="#3B4350"/>
    <line x1="21" y1="10" x2="21" y2="2" stroke="#8FC7A0" stroke-width="3"/>
    <circle cx="21" cy="0" r="3.5" fill="#E08A6B"/>
  </g>

  <!-- Robot C (tiny, on desk) -->
  <g transform="translate(600,246)">
    <rect x="0" y="8" width="34" height="26" rx="10" fill="#E9C97F"/>
    <circle cx="12" cy="20" r="3" fill="#3B4350"/>
    <circle cx="23" cy="20" r="3" fill="#3B4350"/>
    <path d="M13,27 Q17,30 21,27" stroke="#3B4350" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <line x1="17" y1="8" x2="17" y2="2" stroke="#C9A24B" stroke-width="2.6"/>
    <circle cx="17" cy="0" r="3" fill="#E08A6B"/>
  </g>

  <!-- Speech bubble -->
  <g transform="translate(600,22)">
    <rect x="0" y="0" width="164" height="46" rx="14" fill="#FFFFFF" opacity="0.95"/>
    <path d="M30,46 L22,62 L46,46 Z" fill="#FFFFFF" opacity="0.95"/>
    <rect x="16" y="13" width="86" height="7" rx="3.5" fill="#8FC7E8"/>
    <rect x="16" y="27" width="60" height="7" rx="3.5" fill="#D8D2C6"/>
    <circle cx="130" cy="23" r="10" fill="#F2C14E"/>
    <path d="M126,23 l3,3 l6,-7" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="376" width="800" height="24" fill="#E4CDA9"/>
</svg>
