<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#718096"/>
    </linearGradient>
    <linearGradient id="room" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="100%" style="stop-color:#e8e0d0"/>
    </linearGradient>
    <linearGradient id="windowFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#6B5340"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  
  <!-- 天空背景 -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  
  <!-- 遠處山景 -->
  <ellipse cx="200" cy="220" rx="180" ry="80" fill="#5a6a7a" opacity="0.6"/>
  <ellipse cx="550" cy="200" rx="220" ry="100" fill="#4a5a6a" opacity="0.5"/>
  <ellipse cx="700" cy="240" rx="150" ry="70" fill="#5a6a7a" opacity="0.4"/>
  
  <!-- 雨滴 -->
  <g opacity="0.4" filter="url(#blur1)">
    <line x1="100" y1="50" x2="95" y2="120" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="250" y1="30" x2="245" y2="100" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="400" y1="60" x2="395" y2="130" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="550" y1="40" x2="545" y2="110" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="700" y1="70" x2="695" y2="140" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="150" y1="150" x2="145" y2="220" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="300" y1="130" x2="295" y2="200" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="480" y1="160" x2="475" y2="230" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="620" y1="140" x2="615" y2="210" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="50" y1="200" x2="45" y2="270" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="750" y1="180" x2="745" y2="250" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="350" y1="190" x2="345" y2="260" stroke="#c0d0e0" stroke-width="1.5"/>
    <line x1="580" y1="210" x2="575" y2="280" stroke="#c0d0e0" stroke-width="1.5"/>
  </g>
  
  <!-- 雨滴（較清晰） -->
  <g opacity="0.6">
    <line x1="80" y1="100" x2="74" y2="180" stroke="#b8cce0" stroke-width="1"/>
    <line x1="180" y1="80" x2="174" y2="160" stroke="#b8cce0" stroke-width="1"/>
    <line x1="320" y1="110" x2="314" y2="190" stroke="#b8cce0" stroke-width="1"/>
    <line x1="450" y1="90" x2="444" y2="170" stroke="#b8cce0" stroke-width="1"/>
    <line x1="580" y1="120" x2="574" y2="200" stroke="#b8cce0" stroke-width="1"/>
    <line x1="680" y1="100" x2="674" y2="180" stroke="#b8cce0" stroke-width="1"/>
    <line x1="130" y1="220" x2="124" y2="300" stroke="#b8cce0" stroke-width="1"/>
    <line x1="280" y1="240" x2="274" y2="320" stroke="#b8cce0" stroke-width="1"/>
    <line x1="500" y1="230" x2="494" y2="310" stroke="#b8cce0" stroke-width="1"/>
    <line x1="650" y1="250" x2="644" y2="330" stroke="#b8cce0" stroke-width="1"/>
  </g>
  
  <!-- 窗框 -->
  <rect x="50" y="30" width="700" height="400" rx="8" fill="#6B5340" stroke="#5a4530" stroke-width="3"/>
  <rect x="60" y="40" width="680" height="380" fill="url(#sky)"/>
  
  <!-- 窗框分隔 -->
  <line x1="400" y1="40" x2="400" y2="420" stroke="#6B5340" stroke-width="6"/>
  <line x1="60" y1="230" x2="740" y2="230" stroke="#6B5340" stroke-width="6"/>
  
  <!-- 窗台 -->
  <rect x="40" y="420" width="720" height="20" rx="4" fill="#8B7355" stroke="#6B5340" stroke-width="2"/>
  
  <!-- 室內地板 -->
  <rect x="0" y="440" width="800" height="60" fill="#c4b59a"/>
  
  <!-- 茶杯 -->
  <g transform="translate(620, 380)">
    <!-- 杯身 -->
    <ellipse cx="30" cy="30" rx="28" ry="25" fill="#f5f0e8" stroke="#e0d5c5" stroke-width="2"/>
    <ellipse cx="30" cy="28" rx="24" ry="20" fill="#faf8f5"/>
    <!-- 茶 -->
    <ellipse cx="30" cy="30" rx="20" ry="16" fill="#8B6914" opacity="0.7"/>
    <!-- 杯把 -->
    <path d="M55,25 Q70,25 70,35 Q70,45 55,45" stroke="#e0d5c5" stroke-width="3" fill="none"/>
    <!-- 蒸氣 -->
    <path d="M20,5 Q15,-5 25,-15" stroke="#d0d0d0" stroke-width="1.5" fill="none" opacity="0.5">
      <animate attributeName="d" values="M20,5 Q15,-5 25,-15;M20,5 Q25,-5 15,-15;M20,5 Q15,-5 25,-15" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M35,3 Q30,-7 40,-17" stroke="#d0d0d0" stroke-width="1.5" fill="none" opacity="0.4">
      <animate attributeName="d" values="M35,3 Q30,-7 40,-17;M35,3 Q40,-7 30,-17;M35,3 Q30,-7 40,-17" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 窗邊小花盆 -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="40" height="35" rx="4" fill="#c4704a" stroke="#a05535" stroke-width="2"/>
    <rect x="5" y="-15" width="30" height="20" rx="2" fill="#5a8a3a"/>
    <ellipse cx="20" cy="-10" rx="15" ry="12" fill="#6a9a4a"/>
    <ellipse cx="12" cy="-8" rx="8" ry="7" fill="#7aaa5a"/>
    <ellipse cx="28" cy="-8" rx="8" ry="7" fill="#7aaa5a"/>
  </g>
  
  <!-- 標題文字 -->
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6B5340" opacity="0.7">連下幾天雨，才發現自己真的慢下來了</text>
</svg>