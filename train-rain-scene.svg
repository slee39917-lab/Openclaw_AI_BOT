<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#718096"/>
    </linearGradient>
    <!-- Rain gradient -->
    <linearGradient id="rain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0aec0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#a0aec0;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Background sky -->
  <rect width="800" height="400" fill="url(#sky)"/>
  
  <!-- Distant mountains/hills -->
  <path d="M0,280 Q100,220 200,250 Q350,180 500,230 Q650,200 800,240 L800,400 L0,400 Z" fill="#2d3748" opacity="0.6"/>
  
  <!-- Buildings silhouette -->
  <rect x="50" y="200" width="60" height="180" fill="#1a202c" opacity="0.8"/>
  <rect x="120" y="170" width="80" height="210" fill="#1a202c" opacity="0.8"/>
  <rect x="210" y="190" width="50" height="190" fill="#1a202c" opacity="0.8"/>
  <rect x="270" y="160" width="90" height="220" fill="#1a202c" opacity="0.8"/>
  <rect x="380" y="180" width="70" height="200" fill="#1a202c" opacity="0.8"/>
  <rect x="460" y="150" width="100" height="230" fill="#1a202c" opacity="0.8"/>
  <rect x="580" y="190" width="60" height="190" fill="#1a202c" opacity="0.8"/>
  <rect x="650" y="170" width="80" height="210" fill="#1a202c" opacity="0.8"/>
  <rect x="740" y="200" width="60" height="180" fill="#1a202c" opacity="0.8"/>
  
  <!-- Window lights -->
  <rect x="130" y="190" width="15" height="20" fill="#f6e05e" opacity="0.7"/>
  <rect x="160" y="190" width="15" height="20" fill="#f6e05e" opacity="0.5"/>
  <rect x="130" y="230" width="15" height="20" fill="#f6e05e" opacity="0.6"/>
  <rect x="290" y="185" width="15" height="20" fill="#f6e05e" opacity="0.7"/>
  <rect x="320" y="185" width="15" height="20" fill="#f6e05e" opacity="0.4"/>
  <rect x="290" y="225" width="15" height="20" fill="#f6e05e" opacity="0.6"/>
  <rect x="480" y="175" width="15" height="20" fill="#f6e05e" opacity="0.8"/>
  <rect x="510" y="175" width="15" height="20" fill="#f6e05e" opacity="0.5"/>
  <rect x="480" y="215" width="15" height="20" fill="#f6e05e" opacity="0.7"/>
  
  <!-- Ground -->
  <rect x="0" y="350" width="800" height="50" fill="#1a202c"/>
  
  <!-- Train window frame -->
  <rect x="0" y="0" width="800" height="400" fill="none" stroke="#4a5568" stroke-width="20"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#2d3748" stroke-width="5"/>
  
  <!-- Rain drops -->
  <line x1="100" y1="50" x2="80" y2="120" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="30" x2="180" y2="100" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="60" x2="280" y2="130" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="400" y1="40" x2="380" y2="110" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="500" y1="70" x2="480" y2="140" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="600" y1="50" x2="580" y2="120" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="700" y1="30" x2="680" y2="100" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="150" y1="150" x2="130" y2="220" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="130" x2="230" y2="200" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="350" y1="160" x2="330" y2="230" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="450" y1="140" x2="430" y2="210" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="550" y1="170" x2="530" y2="240" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="650" y1="150" x2="630" y2="220" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="120" y1="250" x2="100" y2="320" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="220" y1="230" x2="200" y2="300" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="320" y1="260" x2="300" y2="330" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="420" y1="240" x2="400" y2="310" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="520" y1="270" x2="500" y2="340" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="250" x2="600" y2="320" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  <line x1="720" y1="230" x2="700" y2="300" stroke="url(#rain)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Warm tone overlay -->
  <rect width="800" height="400" fill="#d69e2e" opacity="0.05"/>
</svg>
