<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bright sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#B0E0E6"/>
    </linearGradient>
    <!-- Bright rain gradient -->
    <linearGradient id="rain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:0.2"/>
    </linearGradient>
    <!-- Warm building gradient -->
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Bright sky background -->
  <rect width="800" height="400" fill="url(#sky)"/>
  
  <!-- Sun glow -->
  <circle cx="700" cy="80" r="60" fill="#FFD700" opacity="0.6" filter="url(#glow)"/>
  <circle cx="700" cy="80" r="40" fill="#FFA500" opacity="0.8"/>
  <circle cx="700" cy="80" r="25" fill="#FFFF00"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="60" rx="80" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="180" cy="50" rx="60" ry="25" fill="white" opacity="0.9"/>
  <ellipse cx="500" cy="70" rx="70" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="530" cy="60" rx="50" ry="20" fill="white" opacity="0.8"/>
  
  <!-- Distant mountains -->
  <path d="M0,280 Q100,200 200,240 Q350,160 500,210 Q650,180 800,220 L800,400 L0,400 Z" fill="#4a5568" opacity="0.5"/>
  
  <!-- Buildings with more color -->
  <rect x="50" y="200" width="60" height="180" fill="url(#building)"/>
  <rect x="120" y="170" width="80" height="210" fill="url(#building)"/>
  <rect x="210" y="190" width="50" height="190" fill="url(#building)"/>
  <rect x="270" y="160" width="90" height="220" fill="url(#building)"/>
  <rect x="380" y="180" width="70" height="200" fill="url(#building)"/>
  <rect x="460" y="150" width="100" height="230" fill="url(#building)"/>
  <rect x="580" y="190" width="60" height="190" fill="url(#building)"/>
  <rect x="650" y="170" width="80" height="210" fill="url(#building)"/>
  <rect x="740" y="200" width="60" height="180" fill="url(#building)"/>
  
  <!-- Colorful window lights -->
  <rect x="130" y="190" width="15" height="20" fill="#FFD700" opacity="0.9" filter="url(#glow)"/>
  <rect x="160" y="190" width="15" height="20" fill="#FF6B6B" opacity="0.8"/>
  <rect x="130" y="230" width="15" height="20" fill="#4ECDC4" opacity="0.85"/>
  
  <rect x="290" y="185" width="15" height="20" fill="#FFD700" opacity="0.9"/>
  <rect x="320" y="185" width="15" height="20" fill="#FF6B6B" opacity="0.7"/>
  <rect x="290" y="225" width="15" height="20" fill="#45B7D1" opacity="0.85"/>
  
  <rect x="480" y="175" width="15" height="20" fill="#96CEB4" opacity="0.9"/>
  <rect x="510" y="175" width="15" height="20" fill="#FFEAA7" opacity="0.8"/>
  <rect x="480" y="215" width="15" height="20" fill="#DDA0DD" opacity="0.85"/>
  
  <rect x="670" y="190" width="15" height="20" fill="#FFD700" opacity="0.9"/>
  <rect x="700" y="190" width="15" height="20" fill="#FF6B6B" opacity="0.75"/>
  
  <rect x="750" y="220" width="15" height="20" fill="#4ECDC4" opacity="0.85"/>
  
  <!-- Colorful buildings accents -->
  <rect x="120" y="170" width="80" height="10" fill="#E74C3C" opacity="0.7"/>
  <rect x="460" y="150" width="100" height="10" fill="#3498DB" opacity="0.7"/>
  <rect x="650" y="170" width="80" height="10" fill="#2ECC71" opacity="0.7"/>
  
  <!-- Colorful rain -->
  <line x1="100" y1="50" x2="80" y2="120" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="200" y1="30" x2="180" y2="100" stroke="#ADD8E6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="300" y1="60" x2="280" y2="130" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="400" y1="40" x2="380" y2="110" stroke="#B0E0E6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="500" y1="70" x2="480" y2="140" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="600" y1="50" x2="580" y2="120" stroke="#ADD8E6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="700" y1="30" x2="680" y2="100" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  
  <line x1="150" y1="150" x2="130" y2="220" stroke="#B0E0E6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="250" y1="130" x2="230" y2="200" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="350" y1="160" x2="330" y2="230" stroke="#ADD8E6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="450" y1="140" x2="430" y2="210" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="550" y1="170" x2="530" y2="240" stroke="#B0E0E6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="650" y1="150" x2="630" y2="220" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  
  <line x1="120" y1="250" x2="100" y2="320" stroke="#ADD8E6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="220" y1="230" x2="200" y2="300" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="320" y1="260" x2="300" y2="330" stroke="#B0E0E6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="420" y1="240" x2="400" y2="310" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="520" y1="270" x2="500" y2="340" stroke="#ADD8E6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="620" y1="250" x2="600" y2="320" stroke="#87CEEB" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="720" y1="230" x2="700" y2="300" stroke="#B0E0E6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Colorful ground reflection -->
  <rect x="0" y="350" width="800" height="50" fill="#5D6D7E"/>
  <ellipse cx="200" cy="370" rx="100" ry="10" fill="#FFD700" opacity="0.2"/>
  <ellipse cx="500" cy="380" rx="80" ry="8" fill="#4ECDC4" opacity="0.15"/>
  <ellipse cx="700" cy="365" rx="90" ry="10" fill="#FF6B6B" opacity="0.15"/>
  
  <!-- Train window frame -->
  <rect x="0" y="0" width="800" height="400" fill="none" stroke="#F5F5DC" stroke-width="20" opacity="0.9"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#E8E8E8" stroke-width="5"/>
  
  <!-- Window reflection -->
  <ellipse cx="300" cy="100" rx="120" ry="40" fill="white" opacity="0.1"/>
  <ellipse cx="600" cy="280" rx="150" ry="50" fill="white" opacity="0.08"/>
</svg>
