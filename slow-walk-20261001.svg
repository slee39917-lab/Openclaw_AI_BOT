<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 清晨天空 -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BFE0F2"/>
      <stop offset="55%" style="stop-color:#E6F0E6"/>
      <stop offset="100%" style="stop-color:#FBEED6"/>
    </linearGradient>
    <!-- 朝陽光暈 -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE7A8;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FFE7A8;stop-opacity:0"/>
    </radialGradient>
    <!-- 草地 -->
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B9D5A2"/>
      <stop offset="100%" style="stop-color:#9DC187"/>
    </linearGradient>
    <!-- 小徑 -->
    <linearGradient id="path" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EFE4CC"/>
      <stop offset="100%" style="stop-color:#E3D2B2"/>
    </linearGradient>
    <!-- 樹冠 -->
    <radialGradient id="leaf1" cx="40%" cy="35%" r="70%">
      <stop offset="0%" style="stop-color:#9CC88B"/>
      <stop offset="100%" style="stop-color:#6FA36B"/>
    </radialGradient>
    <radialGradient id="leaf2" cx="40%" cy="35%" r="70%">
      <stop offset="0%" style="stop-color:#B4D69A"/>
      <stop offset="100%" style="stop-color:#7CAE72"/>
    </radialGradient>
    <!-- 柔光 -->
    <linearGradient id="shaft" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF4D6;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#FFF4D6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="400" fill="url(#sky)"/>
  <!-- 朝陽 -->
  <circle cx="640" cy="96" r="130" fill="url(#sunGlow)"/>
  <circle cx="640" cy="96" r="40" fill="#FFE9AE" opacity="0.95"/>
  <!-- 柔光柱 -->
  <polygon points="640,96 300,400 520,400" fill="url(#shaft)"/>

  <!-- 遠山 -->
  <path d="M0 236 Q120 196 250 226 T520 222 T800 232 L800 300 L0 300 Z" fill="#CFE0CB" opacity="0.85"/>
  <path d="M0 258 Q160 224 330 250 T800 252 L800 320 L0 320 Z" fill="#C2D6BC" opacity="0.85"/>

  <!-- 草地 -->
  <rect x="0" y="272" width="800" height="128" fill="url(#grass)"/>

  <!-- 小徑（透視） -->
  <polygon points="356,272 452,272 620,400 176,400" fill="url(#path)"/>
  <polygon points="356,272 372,272 232,400 176,400" fill="#D9C7A4" opacity="0.6"/>
  <polygon points="440,272 452,272 620,400 566,400" fill="#D9C7A4" opacity="0.6"/>

  <!-- 左側樹 -->
  <rect x="118" y="232" width="14" height="70" rx="6" fill="#8C6A4F"/>
  <circle cx="125" cy="196" r="62" fill="url(#leaf1)"/>
  <circle cx="92" cy="222" r="40" fill="url(#leaf2)"/>
  <circle cx="160" cy="220" r="38" fill="url(#leaf2)"/>

  <!-- 右側樹 -->
  <rect x="694" y="244" width="12" height="58" rx="6" fill="#8C6A4F"/>
  <circle cx="700" cy="210" r="52" fill="url(#leaf1)"/>
  <circle cx="668" cy="236" r="34" fill="url(#leaf2)"/>
  <circle cx="732" cy="234" r="32" fill="url(#leaf2)"/>

  <!-- 遠方小花 -->
  <circle cx="250" cy="286" r="4" fill="#E9A0A0"/>
  <circle cx="270" cy="292" r="3.4" fill="#F0C96A"/>
  <circle cx="232" cy="296" r="3.4" fill="#E9A0A0"/>
  <circle cx="590" cy="288" r="4" fill="#F0C96A"/>
  <circle cx="612" cy="296" r="3.4" fill="#E9A0A0"/>

  <!-- 走得很慢的人（側身、一腳前、一腳後） -->
  <g>
    <!-- 後腿 -->
    <rect x="405" y="336" width="7" height="20" rx="3" fill="#6E7A88" transform="rotate(14 408 344)"/>
    <ellipse cx="417" cy="357" rx="8" ry="4" fill="#4A5461"/>
    <!-- 前腿 -->
    <rect x="393" y="336" width="7" height="20" rx="3" fill="#7C8895" transform="rotate(-14 396 344)"/>
    <ellipse cx="388" cy="357" rx="8" ry="4" fill="#4A5461"/>
    <!-- 身體 -->
    <rect x="391" y="304" width="22" height="36" rx="10" fill="#5C7A99"/>
    <!-- 手臂（自然擺動） -->
    <rect x="408" y="308" width="6" height="26" rx="3" fill="#6E8AA5" transform="rotate(16 411 310)"/>
    <rect x="390" y="308" width="6" height="26" rx="3" fill="#6E8AA5" transform="rotate(-16 393 310)"/>
    <!-- 頭 -->
    <circle cx="402" cy="294" r="11" fill="#E8C9A8"/>
    <!-- 帽簷 -->
    <ellipse cx="402" cy="288" rx="15" ry="5" fill="#7B8A6B"/>
    <path d="M389 288 a13 12 0 0 1 26 0 Z" fill="#8A9A78"/>
  </g>

  <!-- 鄰居的小狗（乖乖坐在一旁） -->
  <g>
    <ellipse cx="452" cy="352" rx="13" ry="9" fill="#C9A06A"/>
    <circle cx="462" cy="342" r="7" fill="#D3AC76"/>
    <path d="M457 335 l-3 -7 l7 3 Z" fill="#B98F5C"/>
    <path d="M466 335 l3 -7 l-7 3 Z" fill="#B98F5C"/>
    <rect x="443" y="352" width="4" height="8" rx="2" fill="#B98F5C"/>
    <rect x="456" y="352" width="4" height="8" rx="2" fill="#B98F5C"/>
    <circle cx="465" cy="341" r="1.3" fill="#4A3A2A"/>
  </g>

  <!-- 飄落的幾片葉子 -->
  <ellipse cx="300" cy="150" rx="6" ry="3" fill="#9CC88B" opacity="0.85" transform="rotate(20 300 150)"/>
  <ellipse cx="520" cy="120" rx="6" ry="3" fill="#B4D69A" opacity="0.8" transform="rotate(-25 520 120)"/>
  <ellipse cx="470" cy="210" rx="5" ry="2.6" fill="#B4D69A" opacity="0.8" transform="rotate(35 470 210)"/>
  <ellipse cx="210" cy="180" rx="5" ry="2.6" fill="#9CC88B" opacity="0.75" transform="rotate(-15 210 180)"/>

  <!-- 前景草叢 -->
  <path d="M0 400 Q30 366 60 400 Z" fill="#8FB97C"/>
  <path d="M740 400 Q770 362 800 400 Z" fill="#8FB97C"/>
</svg>
