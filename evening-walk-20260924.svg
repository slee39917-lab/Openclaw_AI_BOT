<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dusk sky gradient -->
    <linearGradient id="duskSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A3B78"/>
      <stop offset="45%" style="stop-color:#8E5A7A"/>
      <stop offset="75%" style="stop-color:#E8927C"/>
      <stop offset="100%" style="stop-color:#FFC971"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE8A3;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FFE8A3;stop-opacity:0"/>
    </radialGradient>
    <!-- Lamp glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="400" fill="url(#duskSky)"/>

  <!-- Low sun -->
  <circle cx="560" cy="250" r="110" fill="url(#sunGlow)"/>
  <circle cx="560" cy="250" r="42" fill="#FFD98A"/>
  <circle cx="560" cy="250" r="32" fill="#FFE9B8"/>

  <!-- Soft clouds in dusk -->
  <ellipse cx="150" cy="70" rx="90" ry="20" fill="#C77B8B" opacity="0.5"/>
  <ellipse cx="190" cy="60" rx="60" ry="16" fill="#D98A86" opacity="0.45"/>
  <ellipse cx="640" cy="90" rx="80" ry="18" fill="#B86B7E" opacity="0.45"/>
  <ellipse cx="380" cy="110" rx="70" ry="15" fill="#D98A86" opacity="0.4"/>
  <ellipse cx="720" cy="150" rx="60" ry="14" fill="#E8927C" opacity="0.4"/>

  <!-- Distant hills -->
  <path d="M0,290 Q120,250 240,280 Q400,245 560,275 Q700,255 800,280 L800,400 L0,400 Z" fill="#3E2F56" opacity="0.75"/>

  <!-- Row of houses (mid-ground) -->
  <rect x="30" y="240" width="110" height="80" fill="#5A4470"/>
  <rect x="30" y="232" width="110" height="10" fill="#463559"/>
  <rect x="170" y="255" width="90" height="65" fill="#6B4E7B"/>
  <rect x="170" y="248" width="90" height="9" fill="#524068"/>
  <rect x="560" y="250" width="100" height="70" fill="#6B4E7B"/>
  <rect x="560" y="243" width="100" height="9" fill="#524068"/>
  <rect x="685" y="262" width="80" height="58" fill="#5A4470"/>
  <rect x="685" y="255" width="80" height="9" fill="#463559"/>

  <!-- Warm windows -->
  <rect x="52" y="258" width="18" height="22" fill="#FFD98A" opacity="0.95"/>
  <rect x="100" y="258" width="18" height="22" fill="#FFC24B" opacity="0.9"/>
  <rect x="52" y="292" width="18" height="22" fill="#FFC24B" opacity="0.8"/>
  <rect x="188" y="272" width="16" height="20" fill="#FFD98A" opacity="0.9"/>
  <rect x="225" y="272" width="16" height="20" fill="#FFE3A3" opacity="0.85"/>
  <rect x="580" y="268" width="16" height="20" fill="#FFD98A" opacity="0.95"/>
  <rect x="620" y="268" width="16" height="20" fill="#FFC24B" opacity="0.85"/>
  <rect x="700" y="280" width="15" height="18" fill="#FFE3A3" opacity="0.9"/>
  <rect x="735" y="280" width="15" height="18" fill="#FFD98A" opacity="0.8"/>

  <!-- Trees -->
  <rect x="330" y="270" width="10" height="55" fill="#3A2C4F"/>
  <ellipse cx="335" cy="255" rx="42" ry="38" fill="#4E6E5A" opacity="0.9"/>
  <ellipse cx="315" cy="265" rx="28" ry="25" fill="#5B7E66" opacity="0.9"/>
  <rect x="470" y="275" width="9" height="50" fill="#3A2C4F"/>
  <ellipse cx="474" cy="262" rx="36" ry="33" fill="#4E6E5A" opacity="0.9"/>
  <ellipse cx="492" cy="270" rx="24" ry="21" fill="#5B7E66" opacity="0.85"/>

  <!-- Ground / sidewalk -->
  <rect x="0" y="320" width="800" height="80" fill="#33284A"/>
  <rect x="0" y="320" width="800" height="14" fill="#463559"/>
  <!-- Sidewalk texture lines -->
  <line x1="60" y1="334" x2="60" y2="400" stroke="#3A2C4F" stroke-width="3"/>
  <line x1="180" y1="334" x2="180" y2="400" stroke="#3A2C4F" stroke-width="3"/>
  <line x1="300" y1="334" x2="300" y2="400" stroke="#3A2C4F" stroke-width="3"/>
  <line x1="420" y1="334" x2="420" y2="400" stroke="#3A2C4F" stroke-width="3"/>
  <line x1="540" y1="334" x2="540" y2="400" stroke="#3A2C4F" stroke-width="3"/>
  <line x1="660" y1="334" x2="660" y2="400" stroke="#3A2C4F" stroke-width="3"/>
  <line x1="780" y1="334" x2="780" y2="400" stroke="#3A2C4F" stroke-width="3"/>

  <!-- Street lamp -->
  <rect x="252" y="210" width="6" height="112" fill="#241B36"/>
  <rect x="238" y="200" width="34" height="14" rx="7" fill="#241B36"/>
  <circle cx="255" cy="216" r="60" fill="url(#lampGlow)"/>
  <circle cx="255" cy="216" r="10" fill="#FFE082"/>
  <!-- Light pool on ground -->
  <ellipse cx="255" cy="330" rx="70" ry="10" fill="#FFD98A" opacity="0.18"/>

  <!-- Walking person silhouette (simple) -->
  <!-- head -->
  <circle cx="405" cy="288" r="11" fill="#241B36"/>
  <!-- body -->
  <path d="M405,299 L405,332" stroke="#241B36" stroke-width="10" stroke-linecap="round"/>
  <!-- arms, one bent forward -->
  <path d="M405,308 L388,322" stroke="#241B36" stroke-width="7" stroke-linecap="round"/>
  <path d="M405,308 L424,318" stroke="#241B36" stroke-width="7" stroke-linecap="round"/>
  <!-- legs mid-stride -->
  <path d="M405,332 L390,358 L388,372" stroke="#241B36" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M405,332 L420,354 L426,368" stroke="#241B36" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- leash to dog -->
  <line x1="424" y1="318" x2="466" y2="346" stroke="#241B36" stroke-width="2.5"/>

  <!-- Small dog -->
  <ellipse cx="478" cy="348" rx="16" ry="10" fill="#241B36"/>
  <circle cx="492" cy="341" r="7" fill="#241B36"/>
  <!-- ears -->
  <path d="M489,335 L486,328 L492,333 Z" fill="#241B36"/>
  <!-- legs -->
  <line x1="468" y1="356" x2="466" y2="368" stroke="#241B36" stroke-width="4" stroke-linecap="round"/>
  <line x1="476" y1="358" x2="476" y2="369" stroke="#241B36" stroke-width="4" stroke-linecap="round"/>
  <line x1="486" y1="358" x2="487" y2="369" stroke="#241B36" stroke-width="4" stroke-linecap="round"/>
  <!-- tail -->
  <path d="M462,346 L454,340" stroke="#241B36" stroke-width="4" stroke-linecap="round"/>

  <!-- A few birds in the dusk sky -->
  <path d="M120,140 q8,-8 16,0 q8,-8 16,0" stroke="#3E2F56" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M180,120 q6,-6 12,0 q6,-6 12,0" stroke="#3E2F56" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M500,90 q7,-7 14,0 q7,-7 14,0" stroke="#5A4470" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Steam / oil-garlic aroma wisps from a house window (subtle) -->
  <path d="M705,272 q4,-8 0,-14 q-4,-6 0,-12" stroke="#FFE3A3" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M737,272 q4,-8 0,-14 q-4,-6 0,-12" stroke="#FFE3A3" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
