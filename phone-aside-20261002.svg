<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 牆面 -->
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBF3E6"/>
      <stop offset="100%" style="stop-color:#F2E3CE"/>
    </linearGradient>
    <!-- 窗外天空（清晨） -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BFE0F2"/>
      <stop offset="60%" style="stop-color:#E7F1E4"/>
      <stop offset="100%" style="stop-color:#FBEFD6"/>
    </linearGradient>
    <!-- 木桌 -->
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D3A874"/>
      <stop offset="100%" style="stop-color:#B98A57"/>
    </linearGradient>
    <!-- 柔光 -->
    <linearGradient id="shaft" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF4D6;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#FFF4D6;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE9B0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FFE9B0;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 牆面 -->
  <rect x="0" y="0" width="800" height="400" fill="url(#wall)"/>

  <!-- 窗戶 -->
  <rect x="58" y="46" width="200" height="156" rx="8" fill="#E9DCC6"/>
  <rect x="70" y="58" width="176" height="132" rx="4" fill="url(#sky)"/>
  <!-- 窗外遠景 -->
  <circle cx="196" cy="96" r="20" fill="#FFE9AE" opacity="0.9"/>
  <path d="M70 150 Q120 132 170 146 T246 148 L246 190 L70 190 Z" fill="#CFE0CB" opacity="0.85"/>
  <!-- 窗框十字 -->
  <rect x="70" y="120" width="176" height="6" fill="#E9DCC6"/>
  <rect x="154" y="58" width="6" height="132" fill="#E9DCC6"/>
  <!-- 朝陽光暈 -->
  <circle cx="196" cy="100" r="120" fill="url(#glow)"/>

  <!-- 餐桌 -->
  <rect x="0" y="272" width="800" height="128" fill="url(#wood)"/>
  <rect x="0" y="272" width="800" height="8" fill="#E0B884"/>
  <!-- 桌上柔光 -->
  <polygon points="150,200 40,400 300,400" fill="url(#shaft)"/>

  <!-- 盤子 -->
  <ellipse cx="238" cy="332" rx="104" ry="36" fill="#FBFBF7"/>
  <ellipse cx="238" cy="332" rx="84" ry="27" fill="#F1EFE8"/>
  <!-- 荷包蛋 -->
  <ellipse cx="214" cy="328" rx="34" ry="21" fill="#FDFDFB"/>
  <circle cx="216" cy="327" r="12" fill="#F2B23E"/>
  <!-- 吐司 -->
  <rect x="252" y="312" width="52" height="30" rx="8" fill="#E8B876"/>
  <rect x="258" y="317" width="40" height="20" rx="6" fill="#F0C68C"/>

  <!-- 豆漿杯 -->
  <rect x="368" y="300" width="58" height="58" rx="8" fill="#FFFFFF"/>
  <rect x="368" y="300" width="58" height="14" rx="7" fill="#EFE7D8"/>
  <ellipse cx="397" cy="301" rx="29" ry="8" fill="#F7F1E4"/>
  <ellipse cx="397" cy="301" rx="23" ry="6" fill="#EFD9A8"/>
  <!-- 蒸氣 -->
  <path d="M384 288 q6 -10 0 -20" stroke="#E6DBC6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M404 286 q6 -12 0 -22" stroke="#E6DBC6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75"/>

  <!-- 手機（面朝下放著） -->
  <ellipse cx="566" cy="374" rx="74" ry="12" fill="#8C6A4F" opacity="0.28"/>
  <rect x="498" y="304" width="136" height="72" rx="14" fill="#2E323A"/>
  <rect x="498" y="304" width="136" height="72" rx="14" fill="none" stroke="#3C414B" stroke-width="2"/>
  <rect x="510" y="314" width="26" height="26" rx="7" fill="#3A3F49"/>
  <circle cx="523" cy="327" r="6" fill="#4A5060"/>

  <!-- 沒被理會的兩則可疑訊息（淡出、飄在旁邊） -->
  <g opacity="0.55">
    <rect x="640" y="150" width="118" height="40" rx="12" fill="#F3D7D7"/>
    <circle cx="662" cy="170" r="4.5" fill="#C97B7B"/>
    <circle cx="676" cy="170" r="4.5" fill="#C97B7B"/>
    <rect x="616" y="206" width="132" height="40" rx="12" fill="#F5E3C6"/>
    <rect x="632" y="220" width="46" height="6" rx="3" fill="#D0A96A"/>
    <rect x="632" y="232" width="84" height="6" rx="3" fill="#D0A96A"/>
  </g>
  <g opacity="0.5">
    <rect x="120" y="212" width="120" height="40" rx="12" fill="#E6DED0"/>
    <rect x="136" y="226" width="52" height="6" rx="3" fill="#B9AC96"/>
    <rect x="136" y="238" width="88" height="6" rx="3" fill="#B9AC96"/>
  </g>

  <!-- 小盆栽 -->
  <path d="M690 272 l6 -40 h44 l6 40 Z" fill="#C97B5A"/>
  <rect x="688" y="266" width="60" height="10" rx="4" fill="#B96B4C"/>
  <ellipse cx="706" cy="228" rx="12" ry="20" fill="#7FB07A" transform="rotate(-24 706 228)"/>
  <ellipse cx="724" cy="222" rx="12" ry="22" fill="#6FA36B"/>
  <ellipse cx="740" cy="232" rx="11" ry="18" fill="#8CBB84" transform="rotate(22 740 232)"/>

</svg>
